bundle:
  name: jpai-chatbot

include:
  - resources/*.yml

variables:
  prefix:
    description: Short name used for app, job and folder names (lowercase, hyphens). A second copy in the same workspace also needs other schema, synced_schema, lakebase_project_id and ai_search_endpoint values (see the portable target).
    default: jpai
  catalog:
    description: Existing Unity Catalog catalog where the schema is created (you need CREATE SCHEMA on it).
  schema:
    description: Schema created by this bundle for all tables, volumes and the AI Search index.
    default: jpai_chatbot
  warehouse_id:
    description: Serverless SQL warehouse used by the app (ops queries) and jobs. Find it under SQL Warehouses.
  lakebase_project_id:
    description: Lakebase Autoscaling project id created by this bundle.
    default: jpai-chatbot
  lakebase_catalog:
    description: UC catalog that holds the Lakebase synced tables. A standard catalog works (no CREATE CATALOG needed).
    default: ${var.catalog}
  synced_schema:
    description: Schema (in UC and in Postgres) of the synced tables. Must differ from `schema`.
    default: jpai_chatbot_ref
  ai_search_endpoint:
    description: AI Search endpoint created by this bundle.
    default: jpai-chatbot-search
  classifier_model_service:
    description: Unity Gateway model service used by the System One API for routing.
    default: system.ai.openjev-qwen35-4b
  embedding_endpoint:
    description: Embedding endpoint used by the AI Search Delta Sync index.
    default: databricks-qwen3-embedding-0-6b
  judge_endpoint:
    description: LLM judge used only by the evaluation job.
    default: databricks-claude-opus-5-5
  admin_emails:
    description: Comma-separated emails allowed to upload documents and see raw ops data and the debug panel.
    default: ${workspace.current_user.userName}

targets:
  # Default target for any workspace. The workspace comes from your CLI profile (--profile), and catalog and
  # warehouse_id from scripts/install.sh, --var or BUNDLE_VAR_* env vars. Nothing to edit in this file.
  # The bundle state lives in a shared folder, so every engineer who deploys to the same workspace updates the same
  # installation (resource names are fixed per workspace).
  az:
    default: true
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

  # The workspace this was built and evaluated on. Kept as an example of a pinned target.
  dev:
    workspace:
      host: https://fevm-serverless-lakebase-praneeth.cloud.databricks.com
    variables:
      catalog: serverless_lakebase_praneeth_catalog
      lakebase_catalog: serverless_lakebase_praneeth_catalog
      warehouse_id: 4d39ac2e32b72a3a

  # A second copy in the same workspace (other names everywhere), used to prove a clean install.
  portable:
    workspace:
      host: https://fevm-serverless-lakebase-praneeth.cloud.databricks.com
    variables:
      prefix: jpai-pt
      catalog: serverless_lakebase_praneeth_catalog
      schema: jpai_chatbot_pt
      warehouse_id: 4d39ac2e32b72a3a
      lakebase_project_id: jpai-chatbot-pt
      lakebase_catalog: serverless_lakebase_praneeth_catalog
      synced_schema: jpai_chatbot_pt_ref
      ai_search_endpoint: jpai-chatbot-search-pt
