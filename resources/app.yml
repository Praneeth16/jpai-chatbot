resources:
  apps:
    chatbot:
      name: ${var.prefix}-chatbot
      description: JPAI chatbot router. HCP question routing, interview form retrieval, ops views (reference implementation for the AWS ECS controller).
      source_code_path: ../app

      lifecycle:
        started: true

      # Single source of truth for the runtime: there is no app/app.yaml next to the code.
      config:
        command: ['npm', 'run', 'start']
        env:
          - name: LAKEBASE_ENDPOINT
            value_from: postgres
          - name: MODEL_SERVICE_NAME
            value: ${var.classifier_model_service}
          - name: MLFLOW_EXPERIMENT_ID
            value_from: experiment
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: warehouse
          - name: INGEST_JOB_ID
            value_from: ingest-job
          - name: AI_SEARCH_INDEX
            value: ${var.catalog}.${var.schema}.if_chunks_idx
          - name: REF_SCHEMA
            value: ${var.synced_schema}
          - name: DOCS_VOLUME
            value: /Volumes/${var.catalog}/${var.schema}/docs
          - name: PAGE_IMAGES_VOLUME
            value: /Volumes/${var.catalog}/${var.schema}/page_images
          # Comma-separated. Gates document upload, raw ops messages and the "Why this route?" panel (CONTRACTS section 8).
          - name: ADMIN_EMAILS
            value: ${var.admin_emails}

      resources:
        - name: postgres
          postgres:
            branch: projects/${resources.postgres_projects.lakebase_project.project_id}/branches/production
            database: projects/${resources.postgres_projects.lakebase_project.project_id}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
        # The classifier model service (MODEL_SERVICE securable) is not yet accepted as an app resource by the bundle
        # schema, so bootstrap_job grants the app service principal EXECUTE on ${var.classifier_model_service}.
        - name: docs-volume
          uc_securable:
            securable_full_name: ${var.catalog}.${resources.schemas.chatbot_schema.name}.${resources.volumes.docs.name}
            securable_type: VOLUME
            permission: WRITE_VOLUME
        - name: page-images-volume
          uc_securable:
            securable_full_name: ${var.catalog}.${resources.schemas.chatbot_schema.name}.${resources.volumes.page_images.name}
            securable_type: VOLUME
            permission: READ_VOLUME
        - name: experiment
          experiment:
            experiment_id: ${resources.experiments.traces.id}
            permission: CAN_EDIT
        - name: warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: ingest-job
          job:
            id: ${resources.jobs.ingest_job.id}
            permission: CAN_MANAGE_RUN
